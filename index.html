<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тренажёр умножения v 0.13</title>

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">

  <style>
    body { font-family: Arial; background:#f5f7fb; margin:0; padding:20px; }
    .card { max-width: 520px; margin:auto; padding:20px; border-radius:20px; background:white; box-shadow:0 6px 20px rgba(0,0,0,0.08); }

    .settings { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .settings div { display:flex; flex-direction:column; font-size:14px; color:#555; }

    input, button { font-size:18px; padding:10px; border-radius:10px; border:1px solid #ddd; }

    button {
      background:#4a90e2;
      color:white;
      border:none;
      cursor:pointer;
      margin-top:14px;
    }

    .question { font-size:36px; margin:20px 0; }
    .feedback { font-size:22px; height:30px; }
    .correct { color:green; }
    .wrong { color:red; }
    .progress { margin-top:10px; color:#777; }

    #answer { width:120px; text-align:center; font-size:26px; }

    .history { margin-top:20px; }
    .history table { width:100%; border-collapse:collapse; font-size:12px; }
    .history th,.history td { border:1px solid #ddd; padding:4px; text-align:center; }
    .toggle { cursor:pointer; color:#4a90e2; margin-top:10px; display:inline-block; }

    .sound-box { margin-top:10px; font-size:14px; color:#555; }
  </style>
</head>
<body>

<div class="card">
  <h2>🧮 Тренажёр умножения</h2>

  <div class="settings">
    <div>Числа от<input id="min" type="number" value="2"></div>
    <div>до<input id="max" type="number" value="4"></div>
    <div>Умножение от<input id="minMul" type="number" value="2"></div>
    <div>до<input id="maxMul" type="number" value="9"></div>
    <div style="grid-column:span 2;">Время (сек)<input id="timeLimit" type="number" value="10"></div>
  </div>

  <div class="sound-box">
    <label><input type="checkbox" id="soundToggle" checked> 🔊 Звук</label>
  </div>

  <button id="startBtn">Старт</button>

  <div class="progress" id="progress"></div>
  <div class="question" id="question"></div>

  <input id="answer" type="number" inputmode="numeric" pattern="\\d*" style="display:none">

  <div class="progress" id="timer"></div>
  <div class="feedback" id="feedback"></div>

  <div id="result"></div>

  <div class="history">
    <div class="toggle" id="toggleHistory">📊 Показать статистику</div>
    <div id="historyTable" style="display:none"></div>
  </div>
</div>

<script>
const minEl=document.getElementById('min');
const maxEl=document.getElementById('max');
const minMulEl=document.getElementById('minMul');
const maxMulEl=document.getElementById('maxMul');
const timeLimitEl=document.getElementById('timeLimit');
const soundToggle=document.getElementById('soundToggle');

const answer=document.getElementById('answer');
const question=document.getElementById('question');
const progress=document.getElementById('progress');
const timerEl=document.getElementById('timer');
const feedback=document.getElementById('feedback');
const result=document.getElementById('result');
const historyTable=document.getElementById('historyTable');
const startBtn=document.getElementById('startBtn');
const toggleHistory=document.getElementById('toggleHistory');

let tasks=[],current=0,correct=0,errors=0;
let timer=null,timeLeft=0,waitingNext=false,startTime;
let locked=false;

function sound(type){
  if(!soundToggle.checked) return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);

  if(type==='ok'){
    o.frequency.value=1000;
  } else {
    o.frequency.value=140;
  }

  o.type='sine';
  g.gain.value=0.2;

  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.18);
  o.stop(ctx.currentTime+0.18);
}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function generateTasks(min,max,minMul,maxMul){
  let arr=[];
  for(let i=min;i<=max;i++) for(let j=minMul;j<=maxMul;j++) arr.push({a:i,b:j,answer:i*j});
  shuffle(arr);
  return arr;
}

function start(){
  tasks=generateTasks(+minEl.value,+maxEl.value,+minMulEl.value,+maxMulEl.value);
  current=0;correct=0;errors=0;
  startTime=Date.now();
  result.innerText='';
  answer.style.display='inline-block';
  nextQuestion();
}

function nextQuestion(){
  clearInterval(timer);
  locked=false;
  if(current>=tasks.length) return finish();

  waitingNext=false;
  feedback.innerText='';

  const t=tasks[current];
  question.innerText=`${t.a} × ${t.b}`;
  progress.innerText=`${current+1}/${tasks.length}`;

  answer.value='';
  answer.focus();

  timeLeft=+timeLimitEl.value;
  updateTimer();

  timer=setInterval(()=>{
    if(locked) return;

    timeLeft--;
    updateTimer();

    if(timeLeft<=0){
      locked=true;
      const val=answer.value.trim()===''?null:+answer.value;
      showResult(val);
    }
  },1000);
}

function updateTimer(){timerEl.innerText=`⏱ ${timeLeft} сек`;}

function showResult(val){
  if(waitingNext) return;
  clearInterval(timer);
  waitingNext=true;

  const t=tasks[current];

  if(val===t.answer){
    correct++;
    feedback.className='feedback correct';
    feedback.innerText='✔ правильно';
    sound('ok');
    setTimeout(goNext,1000);
  } else {
    errors++;
    tasks.push(t);
    feedback.className='feedback wrong';
    feedback.innerText=`✖ ${t.answer}`;
    sound('bad');
  }
}

function goNext(){current++;nextQuestion();}

answer.addEventListener('input',()=>answer.value=answer.value.replace(/[^0-9]/g,''));

answer.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(waitingNext) goNext();
    else showResult(+answer.value);
  }
});

startBtn.onclick=start;
toggleHistory.onclick=()=>{
  historyTable.style.display=historyTable.style.display==='none'?'block':'none';
};

function finish(){
  clearInterval(timer);
  const total=Math.round((Date.now()-startTime)/1000);

  question.innerText='Готово!';
  answer.style.display='none';
  timerEl.innerText='';

  result.innerText=`✔ ${correct} | ✖ ${errors} | ⏱ ${total}s`;

  saveHistory({date:new Date().toLocaleString(),correct,errors,time:total,settings:`${minEl.value}-${maxEl.value} × ${minMulEl.value}-${maxMulEl.value}`});
  renderHistory();
}

function saveHistory(e){let d=JSON.parse(localStorage.getItem('mathTrainerHistory')||'[]');d.unshift(e);localStorage.setItem('mathTrainerHistory',JSON.stringify(d));}

function renderHistory(){
  let d=JSON.parse(localStorage.getItem('mathTrainerHistory')||'[]');
  let html='<table><tr><th>Дата</th><th>Настройки</th><th>✔</th><th>✖</th><th>⏱</th></tr>';
  d.forEach(x=>html+=`<tr><td>${x.date}</td><td>${x.settings}</td><td>${x.correct}</td><td>${x.errors}</td><td>${x.time}</td></tr>`);
  html+='</table>';
  historyTable.innerHTML=html;
}

renderHistory();
</script>
</body>
</html>
